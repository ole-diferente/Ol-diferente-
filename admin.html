<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - OLÉ DIFERENTE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="tienda.css">
    <link rel="stylesheet" href="cart.css">
    <style>
        .admin-container {
            max-width: 1000px;
            margin: 120px auto 50px;
            padding: 0 20px;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }
        .admin-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--accent-color);
        }
        .order-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }
        .order-id {
            font-weight: 600;
            color: var(--accent-color);
        }
        .order-date {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .order-items {
            margin-bottom: 20px;
        }
        .order-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }
        .order-total {
            font-weight: bold;
            font-size: 1.2rem;
            text-align: right;
            margin-top: 10px;
            color: var(--accent-color);
        }
        .btn-approve {
            background: #27ae60;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-approve:hover {
            background: #219653;
        }
        .btn-reject {
            background: transparent;
            color: #eb5757;
            border: 1px solid #eb5757;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            margin-left: 10px;
        }
        .btn-reject:hover {
            background: rgba(235, 87, 87, 0.1);
        }
    </style>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header></header>
    
    <div class="admin-container">
        <div class="admin-header">
            <h1 class="admin-title">Pedidos Pendientes</h1>
        </div>

        <div id="orders-container">
            <p style="text-align: center; color: var(--text-secondary);">Cargando pedidos...</p>
        </div>
    </div>

    <footer></footer>
    <script src="supabase-config.js"></script>
    <script src="components.js?v=2"></script>
    <script src="cart.js?v=2"></script>
    <script src="admin.js?v=2"></script>
</body>
</html>
